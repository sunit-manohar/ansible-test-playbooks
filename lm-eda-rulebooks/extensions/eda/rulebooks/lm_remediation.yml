---
- name: LogicMonitor Alert Handler
  hosts: all
  sources:
    - name: lm_source
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Log every incoming event
      condition: event.payload is defined
      action:
        debug:

    - name: Restart nginx on nginx_down alert
      condition: event.payload.alertType == "nginx_down"
      action:
        run_job_template:
          name: Nginx_Start
          organization: Default
          job_args:
            limit: "{{ event.payload.targetHost }}"
            extra_vars:
              lm_alert_id: "{{ event.payload.alertId }}"
